version: "3"
services:
  sonarqube:
    image: ${SONARQUBE_IMAGE:-sonarqube:26.8.0.126808-community}
    depends_on:
      - db
    secrets:
      - source: sonar_jdbc_password
        type: env
        target: SONAR_JDBC_PASSWORD
    environment:
      SONAR_JDBC_URL: jdbc:postgresql://db:5432/sonar
      SONAR_JDBC_USERNAME: sonar
    volumes:
      - sonarqube_data:/opt/sonarqube/data
      - sonarqube_extensions:/opt/sonarqube/extensions
      - sonarqube_logs:/opt/sonarqube/logs
    ports:
      - "9000:9000"
  db:
    image: postgres:17
    secrets:
      - source: postgres_password
        type: env
        target: POSTGRES_PASSWORD
    environment:
      POSTGRES_USER: sonar
    volumes:
      - postgresql:/var/lib/postgresql
      - postgresql_data_v17:/var/lib/postgresql/data
volumes:
  sonarqube_data:
  sonarqube_extensions:
  sonarqube_logs:
  postgresql:
  postgresql_data_v17:
secrets:
  sonar_jdbc_password:
    external: true
  postgres_password:
    external: true
